target-version = "py313"

[lint]
select = [
  "E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET",
  "ASYNC", "TRY", "PL", "RUF", "D", "ANN",
]
ignore = [
  "D203", "D213", "ANN401", "TRY003", "PLR0911",
]

[lint.per-file-ignores]
"tests/*" = ["D", "ANN", "ARG", "SLF001", "PLR2004"]

[lint.pydocstyle]
convention = "pep257"

[lint.isort]
known-first-party = ["custom_components", "homeassistant", "tests"]
